[build]
  command = "npm run build:web"
  publish = "dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pdfkit reads its font metrics (.afm) from disk at runtime, so ship it unbundled
  external_node_modules = ["pdfkit"]

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (React Router). Do not rewrite /api/* to
# /.netlify/functions/api — api.mts sets config.path = "/api/*", which
# disables that default URL (the rewrite 404s). Netlify matches serverless
# functions before redirects, so this catch-all does not intercept /api/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# OAuth consent screen for AI connectors: never render inside a frame.
[[headers]]
  for = "/oauth/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
